<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found</title>

    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./assets/css/404.css" />
  </head>
  <body class="error-page">
    <!-- Navigation -->
    <nav class="error-nav">
      <div class="error-nav-left">
        <a href="/" class="error-logo">YOUR NAME</a>
      </div>
      <div class="error-nav-right">
        <a href="/">HOME</a>
        <a href="/gallery">GALLERY</a>
        <a href="/contact">CONTACT</a>
      </div>
    </nav>

    <!-- Main Error Content -->
    <main class="error-main">
      <div class="error-content">
        <div class="error-number">404</div>
        <h1 class="error-heading">PAGE NOT FOUND</h1>
        <p class="error-description">
          THE PAGE YOU'RE LOOKING FOR<br />DOESN'T EXIST OR HAS BEEN MOVED
        </p>
        <a href="index.html" class="error-link">RETURN HOME</a>
      </div>
    </main>

    <!-- Footer -->
    <footer class="error-footer">
      <div class="error-footer-left">
        <span>YOUR NAME</span>
      </div>
      <div class="error-footer-center">
        <span>A GRAPHIC DESIGNER</span>
        <span>BASED IN MADRID</span>
      </div>
      <div class="error-footer-right">
        <span>©2025</span>
      </div>
    </footer>
  </body>
</html>
