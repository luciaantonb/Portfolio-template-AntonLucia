# Project details
title:
  es: Plantilla de Portfolio Minimalista
  en: Minimalist Portfolio Website Template
abstract:
  es: |
    Este proyecto consiste en el diseño y desarrollo de una plantilla de portfolio web minimalista con tema oscuro para creativos y diseñadores gráficos. 
    Combina una estructura responsive con animaciones avanzadas mediante GSAP, incluyendo una galería con scroll horizontal y composiciones de imágenes animadas, 
    permitiendo presentar el trabajo de forma inmersiva, coherente y visualmente impactante.
  en: |
    This project focuses on the design and development of a minimalist dark-themed portfolio website template for creatives and graphic designers.
    It combines responsive design with advanced GSAP animations, including a horizontal scrolling gallery and animated image compositions, 
    to create an immersive, cohesive, and visually striking presentation of creative work.

